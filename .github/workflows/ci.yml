name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # solver modules from their repositories at pinned commits (extra "modules"); BWPM and
      # FourierGrating build their CPU cores from source
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev nlohmann-json3-dev libtbb-dev
      - run: pip install -r requirements-dev.txt
      - run: pip install -e ".[modules]"
      - run: pytest -q
        env:
          RTT_FUSION_REQUIRE_MODULES: "1"

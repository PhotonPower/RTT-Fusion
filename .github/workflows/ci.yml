name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  cpp:
    name: C++ port types and BWPM adapter (ctest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev ninja-build
      - run: cmake -S cpp -B build/cpp -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # solver modules from their repositories at pinned commits (extra "modules"); BWPM and
      # FourierGrating build their CPU cores from source
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev nlohmann-json3-dev libtbb-dev libopenblas-dev liblapack-dev libglu1-mesa libxcursor1 libxinerama1 libxft2
      - run: pip install -r requirements-dev.txt
      # The solver modules are built from their repositories at pinned commits (same as the extra
      # "modules" in pyproject.toml) into a wheelhouse that is cached: the key changes with the
      # pins, the constraints, this workflow and the Python version. A cache hit installs the
      # wheels in about a minute instead of building for about 20 minutes.
      - name: wheelhouse cache
        id: wheels
        uses: actions/cache@v4
        with:
          path: wheelhouse
          key: modules-${{ matrix.os }}-py${{ matrix.python }}-${{ hashFiles('pyproject.toml', 'constraints-modules.txt', '.github/workflows/ci.yml') }}
      - name: build bwpm
        if: steps.wheels.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w wheelhouse "bwpm @ git+https://github.com/PhotonPower/BWPM.git@ef2de941d226d364db000a977963b0eba24aea44"
      - name: build fouriergrating
        if: steps.wheels.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w wheelhouse "fouriergrating @ git+https://github.com/PhotonPower/FourierGrating.git@959c93b8d69301492ac927287cddc33c0e6c55b2"
      - name: build fieldtracing
        if: steps.wheels.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w wheelhouse "fieldtracing @ git+https://github.com/PhotonPower/Fieldtracing.git@6da9983387b8872d3241851d04d2012df5baaf48"
      - name: build raytatouille
        if: steps.wheels.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w wheelhouse "raytatouille @ git+https://github.com/PhotonPower/Raytatouille.git@708b6dda655a4bd0f20fb9f34b51c61d51761590"
      - name: build cliffordbem
        if: steps.wheels.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w wheelhouse "cliffordbem @ git+https://github.com/PhotonPower/CliffordBem.git@41e64e627b82f96766c7cfe4f7d663864a5e5cfe"
      - name: build hpfem
        if: steps.wheels.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w wheelhouse "hpfem @ git+https://github.com/PhotonPower/hp-FEM.git@dce07d5d5cc52681715044310c03a10c088d20e7"
      - name: build specklebem
        # SpeckleBem (4f04efe) does not build with pybind11 3.x, and CMake finds the pybind11 of
        # this environment even under build isolation: build it without isolation against
        # pybind11 < 3. On failure the error lines become annotations.
        if: steps.wheels.outputs.cache-hit != 'true'
        run: |
          pip install -c constraints-modules.txt "pybind11<3" "scikit-build-core>=0.10" numpy
          pip wheel -v --no-deps --no-build-isolation -w wheelhouse "specklebem @ git+https://github.com/PhotonPower/SpeckleBem.git@4f04efe26b71f95122ff58cc7589641ba7e8b28f#subdirectory=python" > sb.log 2>&1 || {
            grep -iE "error|fatal|not found|could not" sb.log | tail -n 9 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
      - name: install modules from the wheelhouse
        run: |
          ls wheelhouse
          pip install wheelhouse/*.whl gmsh
      - run: pip install -e .
      - run: pytest -q
        env:
          RTT_FUSION_REQUIRE_MODULES: "1"

name: Wheels

# rtt-fusion: Python with an optional C++ extension (rtt_fusion._diffraction, the grating block's
# per-ray loop): wheels per platform (cibuildwheel; Linux manylinux_2_28 x86_64, Windows AMD64,
# macOS arm64; CPython 3.10-3.13), each tested against the installed wheel, and the sdist (which
# builds the extension if a compiler is there, else installs without it).
# Release: a tag v<version> (= pyproject.toml) attaches them to a GitHub release; a pull request that
# touches the packaging builds them as a check. PyPI only by hand: "Run workflow" on the tag with
# pypi = true (Trusted Publishing: project rtt-fusion, workflow wheels.yml, environment "pypi").
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/wheels.yml", "pyproject.toml", "setup.py", "MANIFEST.in", "cpp/**"]
  workflow_dispatch:
    inputs:
      pypi:
        description: "Upload to PyPI (run on a tag v*)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # the extension must be in the wheel; the tests against the installed package (the
          # solver modules are not installed: their tests skip)
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import rtt_fusion._diffraction" &&
            pytest -q -p no:cacheprovider --rootdir {project} {project}/tests/test_diffraction_cpp.py {project}/tests/test_grating.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag equals the version in pyproject.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "RTT-Fusion ${GITHUB_REF_NAME#v}" --generate-notes

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.pypi && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

name: Wheels

# rtt-fusion is pure Python: one wheel (py3-none-any) and the sdist, tested on Linux, Windows and
# macOS against the installed wheel (the solver modules are not installed: their tests skip).
# Release: a tag v<version> (= pyproject.toml) attaches them to a GitHub release; a pull request that
# touches the packaging builds them as a check. PyPI only by hand: "Run workflow" on the tag with
# pypi = true (Trusted Publishing: project rtt-fusion, workflow wheels.yml, environment "pypi").
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/wheels.yml", "pyproject.toml"]
  workflow_dispatch:
    inputs:
      pypi:
        description: "Upload to PyPI (run on a tag v*)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  test:
    name: test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel
        shell: bash
        run: pip install dist/*.whl pytest
      - name: Test against the installed package (not src/)
        shell: bash
        run: |
          rm -rf src
          python -c "import rtt_fusion as r; print(r.__file__); assert 'site-packages' in r.__file__"
          pytest -q -p no:cacheprovider

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag equals the version in pyproject.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "RTT-Fusion ${GITHUB_REF_NAME#v}" --generate-notes

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.pypi && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

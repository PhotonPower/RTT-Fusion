# Python package rtt_fusion: prototype of the Raytatouille Fusion. Development tools are pinned
# in requirements-dev.txt; solver modules come from their repositories at pinned commits
# (requirements-modules.txt – PyPI accepts no such pins in the metadata).

[build-system]
requires = ["setuptools>=77", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "rtt-fusion"
version = "0.3.3"
description = "Prototype of the Raytatouille Fusion: wave-optical solvers coupled through ports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtt_fusion = ["py.typed", "REFERENCE.md"]  # REFERENCE.md: the reference for agents

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: expensive reference computation (pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "fouriergrating", "fouriergrating.*", "bwpm", "bwpm.*", "fieldtracing", "fieldtracing.*", "raytatouille", "raytatouille.*", "cliffordbem", "cliffordbem.*", "specklebem", "specklebem.*", "hpfem", "hpfem.*", "bindoptix", "bindoptix.*", "mie_reference", "reference_cases"]
ignore_missing_imports = true
